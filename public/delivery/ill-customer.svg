<style>
#Vector, #Group_2, #Group_3, #Vector_10 { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

#Vector { animation: halo 4s ease-in-out infinite; }
#Group_3 { animation: bob 3s ease-in-out infinite; }
#Group_2 { animation: pulse 3s ease-in-out infinite; }
#Vector_10 { animation: ring 3s ease-in-out infinite; }
@keyframes halo { 50% { transform: scale(1.05); } }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes pulse { 0%, 40%, 100% { transform: scale(1); } 20% { transform: scale(1.07); } }
@keyframes ring { 0%, 40%, 100% { transform: rotate(0); } 5%, 15%, 25%, 35% { transform: rotate(-12deg); } 10%, 20%, 30% { transform: rotate(12deg); } }
</style>
