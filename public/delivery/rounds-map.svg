<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="631" height="600" viewBox="0 0 631 600" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
/* One 7s trip: the dot leaves the start node, passes behind the phone, and reaches the end node */
#Vector, #Vector_7, #Vector_10 { transform-box: fill-box; transform-origin: center; }
#Vector { animation: halo 5s ease-in-out infinite; }
#Vector_5 { animation: route 3s ease-in-out infinite; }
#Vector_7 { animation: leave 7s ease-out infinite; }
#Vector_10 { animation: arrive 7s ease-out infinite; }
.node-glow { transform-box: fill-box; transform-origin: center; animation: glow 2.4s ease-in-out infinite; }
#glow-end, #ring-end { animation-delay: -1.2s; }
.node-ring { transform-box: fill-box; transform-origin: center; filter: url(#node-ring-glow); animation: nodeRing 2.4s ease-in-out infinite; }
@keyframes nodeRing { 0%, 100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.1); opacity: 1; } }
@keyframes glow { 0%, 100% { transform: scale(.75); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes halo { 50% { transform: scale(1.03); } }
@keyframes route { 0%, 100% { opacity: .5; } 50% { opacity: .85; } }
@keyframes leave { 0%, 12%, 100% { transform: scale(1); } 5% { transform: scale(1.35); } }
@keyframes arrive { 0%, 86%, 100% { transform: scale(1); } 93% { transform: scale(1.35); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  #route-dot { display: none; }
}
</style>
