<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="251" height="185" viewBox="0 0 251 185" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
#Vector, #Group, #Group_2, #Group_3, #Vector_3 { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

#Vector { animation: halo 4s ease-in-out infinite; }
#Group { animation: float 4s ease-in-out infinite; }
#Vector_2 { animation: fade 4s ease-in-out infinite; }
#Vector_3 { animation: arrow 4s ease-in-out infinite; }
#Group_2 { animation: pulse 4s ease-in-out infinite; }
#Group_3 { animation: pop 4s ease-out infinite; }
@keyframes halo { 50% { transform: scale(1.05); } }
@keyframes float { 50% { transform: translateY(-4px); } }
@keyframes fade { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes arrow { 0%, 100% { transform: translateY(-5px); opacity: .35; } 50% { transform: translateY(1px); opacity: 1; } }
@keyframes pulse { 0%, 45%, 75%, 100% { transform: scale(1); } 60% { transform: scale(1.06); } }
@keyframes pop { 0%, 50% { transform: scale(0); } 62% { transform: scale(1.2); } 70%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
</style>
